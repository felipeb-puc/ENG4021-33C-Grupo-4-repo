<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Nexo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="../static/css/geral.css" rel="stylesheet">
    <link href="../static/css/tela-login.css" rel="stylesheet">
</head>
<body>

    <div id="topo">
        <div class="menu">
            <a href="../templates/tela-inicial.html" class="logo"><img src="../static/imagens/logoNEXO.png"></a>
        </div>
        <div class="menu">
            <a href="../templates/tela-login.html">Entrar</a>
            <a href="../templates/PROJETOtela_escolha_login.html" class="ativo">Criar conta →</a>
        </div>
    </div>

    <div id="centro">
        <img id="logo-grande" src="../static/imagens/logoNEXO.png">
        <h1>Entrar no NEXO</h1>
        <p class="cinza">Use o e-mail cadastrado na sua conta.</p>
        
        {% for mensagem in messages %}
        <p class="mensagem">{{ mensagem }}</p>
        {% endfor %}
        
        <form class="caixa" method="POST">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <label for="{{ form.email.id_for_label }}">E-mail</label>
            {{ form.email }}
            {{ form.email.errors }}
            <label for="{{ form.senha.id_for_label }}">Senha</label>
            {{ form.senha }}
            {{ form.senha.errors }}
            <button type="submit" class="botao"><a style="color: white"href="../templates/Inicio.html">Entrar →</a></button>
        </form>


        <p class="cinza">Não tem conta? <a href="../templates/PROJETOtela_escolha_login.html">Criar agora</a></p>
    </div>

</body>
</html>
