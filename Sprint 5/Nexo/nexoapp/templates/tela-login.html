<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Nexo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="../static/css/tela-login.css" rel="stylesheet">
</head>
<body>

    <div id="topo">
        <img src="../static/imagens/logoNEXO.png">
        <a href="../templates/tela-login.html">Entrar</a>
        <a href="../templates/PROJETOtela_escolha_login.html">Criar conta-></a>
    </div>

    <div id="login">
        <img src="../static/imagens/logoNEXO.png">

        <h1>Entrar no NEXO</h1>
        <p id="subtitulo">Use o e-mail cadastrado na sua conta.</p>

        <form>
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="seu.email@universidade.br">

            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Sua senha">

            <button type="button"><a href="../templates/Inicio.html">Entrar -></a></button>
        </form>

        <p id="sem-conta">Não tem conta? <a href="../templates/PROJETOtela_escolha_login.html">Criar agora</a></p>
    </div>

</body>
</html>
