<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Nexo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="../static/css/geral.css" rel="stylesheet">
    <link href="../static/css/tela-login.css" rel="stylesheet">
</head>
<body>

    <div id="topo">
        <div class="menu">
            <a href="#" class="logo"><img src="../static/imagens/logoNEXO.png"></a>
        </div>
        <div class="menu">
            <a href="#">Entrar</a>
            <a href="#" class="ativo">Criar conta →</a>
        </div>
    </div>

    <div id="centro">
        <img id="logo-grande" src="../static/imagens/logoNEXO.png">
        <h1>Entrar no NEXO</h1>
        <p class="cinza">Use o e-mail cadastrado na sua conta.</p>

        <form class="caixa">
            <label for="email">E-mail</label>
            <input type="email" id="email" class="com-icone" placeholder="seu.email@universidade.br">
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Sua senha">
            <button type="submit" class="botao">Entrar →</button>
        </form>


        <p class="cinza">Não tem conta? <a href="#">Criar agora</a></p>
    </div>

</body>
</html>
