<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liga Acadêmica - Nexo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="../static/css/tela-liga-academica.css" rel="stylesheet">
</head>
<body>

    <header id="topo">
        <div class="linha">
            <img src="../static/imagens/logo.svg" alt="NEXO" class="logo">
            <a href="#" class="avatar">IC</a>
        </div>
        <nav>
            <a href="../templates/tela-inicial.html">Tela inicial</a>
            <a href="#">Histórico</a>
            <a href="#">Favoritos <span class="contador" id="num-favoritos">0</span></a>
            <a href="#">Candidaturas <span class="contador" id="num-candidaturas">0</span></a>
            <a href="#">Perfil</a>
        </nav>
    </header>

    <main>
        <div class="pilulas">
            <a href="../templates/estagio.html">Estágio 62</a>
            <a href="/">Monitoria 24</a>
            <a href="../templates/Iniciacao-Cientifica.html">Iniciação científica 18</a>
            <a href="../templates/tela-liga-academica.html" class="ativo">Liga acadêmica 9</a>
        </div>

        <h1>Liga acadêmica</h1>
        <p class="cinza" id="contagem"></p>

        <div class="pilulas" id="botoes">
            <button type="button" data-ordem="recentes" class="ativo">Recentes</button>
            <button type="button" data-ordem="perto">Perto de mim</button>
            <button type="button" id="abrir-filtros">Filtros</button>
        </div>

        <form id="filtros" class="caixa" hidden>
            <p class="rotulo">Modalidade</p>
            <div class="pilulas modalidades">
                <input type="checkbox" id="m1" value="Presencial"><label for="m1">Presencial</label>
                <input type="checkbox" id="m2" value="Híbrido"><label for="m2">Híbrido</label>
                <input type="checkbox" id="m3" value="Remoto"><label for="m3">Remoto</label>
            </div>
            <label class="chave"><input type="checkbox" id="remuneradas"><span></span> Só remuneradas</label>
            <label class="chave"><input type="checkbox" id="abertas" checked><span></span> Só inscrições abertas</label>
        </form>

        <div id="lista"></div>
    </main>

    <script>
        const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
        const dia = n => new Date(hoje.getTime() + n * 86400000);
        const faltam = d => Math.round((d - hoje) / 86400000);

        // título | instituição | horas | bolsa | modalidade | distância (km) | prazo (dias) | publicado (dias atrás)
        const ligas = [
            ["Liga de Mercado Financeiro", "PUC-Rio", 6, 0, "Híbrido", 0.2, 7, 2],
            ["Liga de Empreendedorismo", "PUC-Rio", 4, 0, "Presencial", 0.3, 14, 9],
            ["Liga de Direito Digital", "PUC-Rio", 4, 0, "Remoto", 0.5, 10, 10],
            ["Liga de Inteligência Artificial", "PUC-Rio", 8, 0, "Híbrido", 0.4, 5, 1],
            ["Liga de Engenharia de Petróleo", "PUC-Rio", 6, 300, "Presencial", 1.2, 20, 4],
            ["Liga de Saúde Pública", "Hospital Escola", 6, 0, "Presencial", 3.5, 3, 6],
            ["Liga de Marketing", "PUC-Rio", 4, 0, "Remoto", 0.6, 18, 12],
            ["Liga de Sustentabilidade", "PUC-Rio", 5, 0, "Presencial", 0.8, -2, 20],
            ["Liga de Data Science", "PUC-Rio", 6, 400, "Híbrido", 0.4, 25, 3]
        ].map(([titulo, inst, horas, bolsa, modalidade, km, prazo, publicado]) =>
            ({ titulo, inst, horas, bolsa, modalidade, km, prazo: dia(prazo), publicado: dia(-publicado), favorito: false, candidatou: false }));

        const $ = id => document.getElementById(id);
        let ordem = "recentes";

        function atualizar() {
            const modalidades = [...document.querySelectorAll(".modalidades input:checked")].map(c => c.value);

            const lista = ligas.filter(o =>
                (modalidades.length === 0 || modalidades.includes(o.modalidade)) &&
                (!$("remuneradas").checked || o.bolsa > 0) &&
                (!$("abertas").checked || faltam(o.prazo) >= 0)
            ).sort((a, b) => ordem === "perto" ? a.km - b.km : b.publicado - a.publicado);

            const n = lista.length;
            $("contagem").textContent = `${n} oportunidade${n === 1 ? "" : "s"} aberta${n === 1 ? "" : "s"} na sua universidade`;
            $("num-favoritos").textContent = ligas.filter(o => o.favorito).length;
            $("num-candidaturas").textContent = ligas.filter(o => o.candidatou).length;

            $("lista").innerHTML = n === 0
                ? `<div class="vazio"><h3>Nada com esses filtros</h3><p>Tente tirar algum filtro.</p></div>`
                : lista.map(o => {
                    const i = ligas.indexOf(o);
                    const d = faltam(o.prazo);
                    const data = o.prazo.toLocaleDateString("pt-BR");
                    return `
                        <article class="cartao">
                            <div class="linha">
                                <span class="tag">${o.modalidade}</span>
                                <button type="button" class="favorito ${o.favorito ? "marcado" : ""}" onclick="favoritar(${i})">${o.favorito ? "♥" : "♡"}</button>
                            </div>
                            <h3>${o.titulo}</h3>
                            <p class="cinza">${o.inst}</p>
                            <div class="info">
                                <span>${o.horas}h por semana</span>
                                <span>${o.bolsa ? "R$ " + o.bolsa.toLocaleString("pt-BR") : "Voluntária"}</span>
                                ${ordem === "perto" ? `<span>${o.km.toString().replace(".", ",")} km</span>` : ""}
                            </div>
                            <div class="linha rodape">
                                <p class="prazo ${d < 0 ? "encerrado" : d <= 7 ? "urgente" : ""}">
                                    ${d < 0 ? "Inscrições encerradas" : "Inscrições até"} <strong>${data}</strong>
                                </p>
                                <button type="button" class="botao" ${d < 0 ? "disabled" : ""} onclick="candidatar(${i})">
                                    ${o.candidatou ? "✓ Candidatado" : "Candidatar-se"}
                                </button>
                            </div>
                        </article>`;
                }).join("");
        }

        function favoritar(i) { ligas[i].favorito = !ligas[i].favorito; atualizar(); }
        function candidatar(i) { ligas[i].candidatou = !ligas[i].candidatou; atualizar(); }

        document.querySelectorAll("[data-ordem]").forEach(b => b.onclick = () => {
            ordem = b.dataset.ordem;
            document.querySelectorAll("[data-ordem]").forEach(x => x.classList.toggle("ativo", x === b));
            atualizar();
        });

        $("abrir-filtros").onclick = () => {
            $("filtros").hidden = !$("filtros").hidden;
            $("abrir-filtros").classList.toggle("ativo", !$("filtros").hidden);
        };

        $("filtros").onchange = atualizar;
        atualizar();
    </script>

</body>
</html>
