<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Criar conta de recrutador - NEXO</title>
    <link rel="stylesheet" href="../static/css/PROJETOtela_informacoes_recrutador.css">
</head>
<body>
    <div class="container">
        <a href="" class="voltar">&larr; Trocar tipo de conta</a>
        <p class="titulo">CONTA DE RECRUTADOR</p>
        <h1>Criar sua conta de recrutador</h1>
        <p class="subtitulo">Depois de verificada, sua empresa publica vagas de estágio e busca candidatos por universidade, curso, período e CR.</p>
        <form>
            <h3>Seus dados</h3>
            <div class="grid">
                <div class="campo">
                    <label>Nome completo</label>
                    <input type="text" placeholder="Camila Duarte">
                </div>
                <div class="campo">
                    <label>E-mail corporativo</label>
                    <input type="email" placeholder="camila.duarte@empresa.com">
                </div>
                <div class="campo">
                    <label>Cargo ou função</label>
                    <input type="text" placeholder="Gerente de RH">
                </div>
                <div class="campo">
                    <label>Senha</label>
                    <input type="password" placeholder="Mínimo de 8 caracteres">
                </div>
            </div>

            <h3>Empresa</h3>
            <div style="max-width: 240px;">
                <div class="campo">
                    <label>Empresa</label>
                    <select>
                        <option>Selecione</option>
                        <option>Oportunity</option>
                        <option>Viságio</option>
                        <option>Nortec Industria</option>
                    </select>
                </div>
            </div>

            <div class="checkbox-group">
                <label>
                    <input type="checkbox" checked> Aceito os termos de uso e a política de privacidade.
                </label>
            </div>

            <div class="acoes">
                <button type="submit">Criar conta &rarr;</button>
            </div>
        </form>
    </div>

</body>
</html>
