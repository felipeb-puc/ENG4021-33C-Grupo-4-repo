<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Criar conta de estudante - NEXO</title>
    <link rel="stylesheet" href="../static/css/PROJETOtela_informacoes_estudante.css">
</head>
<body>
    <div class="container">
        <a href="#" class="voltar">&larr; Trocar tipo de conta</a>
        <p class="titulo">CONTA DE ESTUDANTE</p>
        <h1>Criar sua conta de estudante</h1>
        <p class="subtitulo">Com esses dados o NEXO já mostra apenas as oportunidades da sua universidade.</p>
        <form>
            <h3>Dados pessoais</h3>
            <div class="grid">
                <div class="campo">
                    <label>Nome completo</label>
                    <input type="text" placeholder="Isabela Corrêa">
                </div>
                <div class="campo">
                    <label>E-mail acadêmico</label>
                    <input type="email" placeholder="isabela.correa@aluno.puc-rio.br">
                </div>
                <div class="campo">
                    <label>Senha</label>
                    <input type="password" placeholder="Mínimo de 8 caracteres">
                </div>
                <div class="campo">
                    <label>Matrícula</label>
                    <input type="text" placeholder="2410123">
                </div>
            </div>

            <h3>Vida acadêmica</h3>
            <div class="grid">
                <div class="campo">
                    <label>Universidade</label>
                    <select>
                        <option>PUC-Rio</option>
                    </select>
                </div>
                <div class="campo">
                    <label>Curso</label>
                    <select>
                        <option>Selecione o curso</option>
                    </select>
                </div>
                <div class="campo">
                    <label>Período atual</label>
                    <select>
                        <option>1º período</option>
                    </select>
                </div>
                <div class="campo">
                    <label>CR (opcional)</label>
                    <input type="text" placeholder="8,4">
                </div>
            </div>

            <div class="checkbox-group">
                <label>
                    <input type="checkbox" checked> Quero aparecer em buscas de recrutadores
                </label>
                <label>
                    <input type="checkbox"> Aceito os termos de uso e a política de privacidade
                </label>
            </div>

            <div class="acoes">
                <button type="submit">Criar conta &rarr;</button>
            </div>
        </form>
    </div>

</body>
</html>
