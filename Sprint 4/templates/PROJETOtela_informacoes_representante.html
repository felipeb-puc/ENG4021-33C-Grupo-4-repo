<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Criar conta de representante acadêmico - NEXO</title>
    <link rel="stylesheet" href="../static/css/PROJETOtela_informacoes_representante.css">
</head>
<body>
    <div class="container">
        <a href="" class="voltar">&larr; Trocar tipo de conta</a>
        <p class="titulo">CONTA DE REPRESENTANTE ACADÊMICO</p>
        <h1>Criar sua conta de representante acadêmico</h1>
        <p class="subtitulo">Para coordenações, departamentos, laboratórios, ligas acadêmicas e equipes de competição que publicam oportunidades internas.</p>
        <form>
            <h3>Seus dados</h3>
            <div class="grid">
                <div class="campo">
                    <label>Nome completo</label>
                    <input type="text" placeholder="Rafel Amorim">
                </div>
                <div class="campo">
                    <label>E-mail institucional</label>
                    <input type="email" placeholder="rafel.amorim@puc-rio.br">
                </div>
                <div class="campo">
                    <label>Cargo ou função</label>
                    <input type="text" placeholder="Coordenador de Estágios">
                </div>
                <div class="campo">
                    <label>Senha</label>
                    <input type="password" placeholder="Mínimo de 8 caracteres">
                </div>
            </div>

            <h3>Instituição</h3>
            <div style="max-width: 240px;">
                <div class="campo">
                    <label>Instituição</label>
                    <select>
                        <option>Selecione</option>
                        <option>PUC-Rio</option>
                        <option>UFRJ</option>
                        <option>Departamento de Informática - PUC-Rio</option>
                    </select>
                </div>
            </div>
            <div class="checkbox-group">
                <label>
                    <input type="checkbox" checked> Aceito os termos de uso e a política de privacidade.
                </label>
            </div>
            <div class="acoes">
                <button type="submit">Criar conta &rarr;</button>
            </div>
        </form>
    </div>
</body>
</html>
